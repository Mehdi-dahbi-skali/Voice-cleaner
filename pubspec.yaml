name: flutter_frontend
description: A simple Flutter frontend app for Spring Boot backend integration
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # HTTP client for API calls
  http: ^1.1.0
  
  # State management
  provider: ^6.1.1
  
  # JSON serialization
  json_annotation: ^4.8.1
  
  # UI components
  cupertino_icons: ^1.0.6
  
  # Audio recording
  record: ^5.0.4
  
  # Permissions handling
  permission_handler: ^11.1.0
  
  # Path provider for file storage
  path_provider: ^2.1.1

  # Audio playback
  audioplayers: ^5.2.1
  
  # Visualisation waveform
  audio_waveforms: ^1.0.5
  
  # Partage
  share_plus: ^7.2.1

  # Date formatting
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.7
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true

